<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marsha — DBT Skills Trainer</title>
<style>
  :root {
    --bg: #f6f2ea; --ink: #2e2a25; --accent: #b4552d; --card: #fffdf8;
    --marsha: #efe6d6; --user: #dce6e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 14px 20px; border-bottom: 2px solid var(--accent);
    background: var(--card); display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { margin: 0; font-size: 1.3rem; font-weight: normal; }
  header h1 em { color: var(--accent); }
  header .sub { font-size: 0.78rem; color: #7a6f60; font-style: italic; }
  header label {
    margin-left: auto; font-size: 0.8rem; color: #7a6f60;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-family: system-ui, sans-serif;
  }
  #chat { flex: 1; overflow-y: auto; padding: 18px; }
  .msg {
    max-width: 46rem; margin: 0 auto 12px; padding: 12px 16px;
    border-radius: 10px; line-height: 1.55; white-space: pre-wrap;
  }
  .marsha { background: var(--marsha); border-left: 4px solid var(--accent); }
  .user { background: var(--user); }
  .who { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
         color: #8a7d6b; margin-bottom: 4px; font-family: system-ui, sans-serif; }
  form {
    display: flex; gap: 10px; padding: 14px 18px; background: var(--card);
    border-top: 1px solid #e0d6c4;
  }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 10px 12px;
    border: 1px solid #cbbfa9; border-radius: 8px; background: #fff;
    max-width: 42rem; margin-left: auto;
  }
  button {
    font-family: system-ui, sans-serif; font-size: 0.95rem; padding: 0 22px;
    border: none; border-radius: 8px; background: var(--accent); color: #fff;
    cursor: pointer; margin-right: auto;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .disclaimer {
    max-width: 46rem; margin: 0 auto 14px; font-size: 0.78rem; color: #8a7d6b;
    font-style: italic; text-align: center; padding: 0 10px;
  }
</style>
</head>
<body>
<header>
  <h1>Marsha <em>— DBT skills trainer</em></h1>
  <span class="sub">validation and change, both at once</span>
  <label><input type="checkbox" id="voice"> speak replies</label>
</header>

<div id="chat">
  <div class="disclaimer">
    Marsha is an educational chatbot inspired by the published work and style of
    Dr. Marsha Linehan. It is not her, not therapy, and not a crisis service.
    If you are in crisis, call or text 988 (US) or your local emergency number.
  </div>
</div>

<form id="form">
  <textarea id="input" rows="2" placeholder="Tell Marsha what's going on, or ask for a skills training…"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const voiceToggle = document.getElementById('voice');
const messages = [];

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'marsha');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? 'You' : 'Marsha';
  const body = document.createElement('div');
  body.textContent = text;
  div.append(who, body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

// Pick a warm, mature female voice from what the browser offers.
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /female|samantha|karen|victoria|martha|serena/i.test(v.name) && v.lang.startsWith('en'))
       || vs.find(v => v.lang.startsWith('en')) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text) {
  if (!voiceToggle.checked || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.rate = 0.92;   // unhurried
  u.pitch = 0.9;   // lower, steadier
  speechSynthesis.speak(u);
}

async function ask(text) {
  messages.push({ role: 'user', content: text });
  addBubble('user', text);
  const body = addBubble('marsha', '…');
  send.disabled = true;
  let full = '';
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const ev of events) {
        if (!ev.startsWith('data: ')) continue;
        const d = JSON.parse(ev.slice(6));
        if (d.text) { full += d.text; body.textContent = full; }
        if (d.error) { full += '\n[' + d.error + ']'; body.textContent = full; }
        chat.scrollTop = chat.scrollHeight;
      }
    }
  } catch (e) {
    body.textContent = full + '\n[connection lost — try again]';
  }
  messages.push({ role: 'assistant', content: full });
  speak(full);
  send.disabled = false;
  input.focus();
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = '';
  ask(text);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
</script>
</body>
</html>
